// ============================================================
// Kerbal Kalendar — Settings.cfg
// ============================================================
// This file stores user preferences for the Kerbal Kalendar mod.
// Edit values here or use the in-game Settings window.
//
// Do NOT remove or rename top-level nodes — the mod reads
// this file by node name at startup.
// ============================================================

KERBAL_KALENDAR_SETTINGS
{
    // ── Display ──────────────────────────────────────────────
    // Format for the toolbar button label.
    // Options:
    //   SHORT    →  "23 Harven KY 415"           (default)
    //   FULL     →  "23 Harven KY 415 | 03:15:22"
    //   MINIMAL  →  "Harven 415"
    displayFormat = SHORT

    // Show the time-of-day (HH:MM:SS) in the expanded window.
    // true / false
    showTimeOfDay = true

    // Show the month progress bar in the expanded window.
    // true / false
    showProgressBar = true

    // Show the leap year / Kolvari indicator line.
    // true / false
    showLeapIndicator = true

    // ── Epoch ─────────────────────────────────────────────────
    // The KY year that UT=0 corresponds to.
    // Change this only if you want to shift the starting year.
    // Default: 412  (i.e. game starts at 1 Kelbris, KY 412)
    epochYear = 412

    // ── Compatibility ─────────────────────────────────────────
    // Replace KSP's stock date display string with the Kalendar date.
    // Affects the UT readout at the top of the screen.
    // true / false
    replaceStockDateDisplay = true

    // Log debug output to KSP.log.
    // Set to true only when troubleshooting.
    debugLogging = false
}

